<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Admin Lojinha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Lora:wght@700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #F5F0E8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
    }
    .brand { text-align: center; margin-bottom: 32px; }
    .brand h1 { font-family: 'Lora', serif; font-size: 1.5rem; color: #1a1a1a; }
    .brand h1 span { color: #2D6A4F; }
    .brand p { color: #777; font-size: 0.9rem; margin-top: 6px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #333; margin-bottom: 6px; }
    input[type="password"] {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid #ddd; border-radius: 8px;
      font-family: inherit; font-size: 0.95rem; outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: #2D6A4F; }
    .btn {
      width: 100%; padding: 13px;
      background: #2D6A4F; color: #fff;
      border: none; border-radius: 8px;
      font-family: inherit; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: background .2s; margin-top: 4px;
    }
    .btn:hover { background: #245c43; }
    .error {
      background: #fff0f0; border: 1px solid #f5c6c6; color: #c0392b;
      border-radius: 8px; padding: 10px 14px; font-size: 0.88rem;
      margin-bottom: 18px; display: none;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
<div class="card">
  <div class="brand">
    <h1>Lojinha do Dev <span>• Admin</span></h1>
    <p>Digite a senha para acessar o painel</p>
  </div>
  <div class="error" id="err">Senha incorreta. Tente novamente.</div>
  <form id="form">
    <div class="form-group">
      <label for="pwd">Senha</label>
      <input type="password" id="pwd" autofocus required placeholder="••••••••">
    </div>
    <button type="submit" class="btn">Entrar</button>
  </form>
</div>
<script>
  // ─── CONFIGURE A SENHA AQUI ───────────────────────────────────────────────
  const ADMIN_PASSWORD = 'devanil123';
  // ──────────────────────────────────────────────────────────────────────────

  // Se já está autenticado, vai direto pro painel
  if (sessionStorage.getItem('admin_auth') === 'ok') {
    location.replace('index.html');
  }

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    const entered = document.getElementById('pwd').value;
    if (entered === ADMIN_PASSWORD) {
      sessionStorage.setItem('admin_auth', 'ok');
      location.replace('index.html');
    } else {
      document.getElementById('err').classList.add('show');
      document.getElementById('pwd').value = '';
      document.getElementById('pwd').focus();
    }
  });
</script>
</body>
</html>
