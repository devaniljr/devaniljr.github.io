name: Deploy Lojinha do Dev no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Preparar Arquivos Públicos (Excluindo Admin)
        run: |
          mkdir _site
          cp index.html _site/
          cp produtos.json _site/
          cp -r css _site/
          cp -r js _site/
          cp -r images _site/
          touch _site/.nojekyll
          echo "Arquivos preparados para publicação sem a pasta admin."

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload de Artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
